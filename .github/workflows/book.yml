name: Build book PDFs and publish dated release

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'portada.jpg'
      - '.github/workflows/book.yml'
  workflow_dispatch:

permissions:
  contents: write
  # Needed to dispatch the Pages deployment after stamping the release date.
  actions: write

concurrency:
  group: book
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Full TeX Live (latexmk + all packages used: algorithm, algpseudocode,
    # contour, eso-pic, pdfrender, ...). The Makefile is the single source of
    # truth for how the PDFs and KDP covers are built.
    container: texlive/texlive:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools (ImageMagick, pdfinfo, make, Python figure deps)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make gawk imagemagick poppler-utils curl \
            python3 python3-numpy python3-scipy python3-matplotlib python3-networkx

      - name: Date stamp
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build all editions + covers into out/
        run: make -C book dist

      - name: Publish dated GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: book-${{ steps.date.outputs.date }}
          name: Geometric Deep Learning — ${{ steps.date.outputs.date }}
          body: >-
            Book PDFs built on ${{ steps.date.outputs.date }}.
            `geometric-deep-learning.pdf` — A4 reading edition (English);
            `geometric-deep-learning-print.pdf` — 7×10 in print edition (English);
            `geometric-deep-learning-es.pdf` — A4 reading edition (Spanish);
            `geometric-deep-learning-print-es.pdf` — 7×10 in print edition (Spanish);
            `geometric-deep-learning-cover.pdf` / `-cover-es.pdf` — KDP wraparound covers.
          make_latest: true
          files: out/*.pdf

      # The website shows when the book was last updated. Its source of truth is
      # a single constant, rewritten here so it can never drift from the release
      # that was just published.
      - name: Stamp the release date on the website
        id: stamp
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > web/src/data/book.ts <<EOF
          // Date of the latest published book edition, in ISO form, matching the
          // GitHub Release tag \`book-YYYY-MM-DD\` that carries the PDFs.
          //
          // This file is rewritten automatically by .github/workflows/book.yml after it
          // publishes a release, so it always tracks the newest edition. Edit it by hand
          // only to correct a mistake.
          export const bookUpdated = '${{ steps.date.outputs.date }}';
          EOF
          if git diff --quiet -- web/src/data/book.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo ">> release date unchanged, website already up to date"
          else
            git add web/src/data/book.ts
            git commit -m "Stamp book release date ${{ steps.date.outputs.date }}"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the default GITHUB_TOKEN does not trigger other
      # workflows, so the commit above would never reach the live site on its
      # own. Dispatch the Pages deployment explicitly instead.
      - name: Redeploy the website with the new date
        if: steps.stamp.outputs.changed == 'true'
        run: |
          curl -sS -X POST --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
